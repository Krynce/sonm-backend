[package]
name = "sonm-database"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Paul Makles <me@insrt.uk>"]
description = "Sonm: Database Implementation"
repository = "https://github.com/krynce/sonm-backend"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Databases

# ... Other
tasks = ["isahc", "linkify", "url-escape"]
tokio-runtime = ["tokio"]
rocket-impl = ["rocket", "schemars", "revolt_okapi", "revolt_rocket_okapi"]
axum-impl = ["axum", "sonm-result/axum", "utoipa"]
redis-is-patched = ["sonm-presence/redis-is-patched"]
voice = ["livekit-api", "livekit-protocol", "livekit-runtime"]

# Default Features
default = ["tokio-runtime", "tasks"]

[dependencies]
# Core
sonm-config = { workspace = true, features = ["report-macros"] }
sonm-result = { workspace = true }
sonm-models = { workspace = true, features = ["validator"] }
sonm-presence = { workspace = true }
sonm-permissions = { workspace = true, features = ["serde", "bson"] }
sonm-parser = { workspace = true }

# Utility
log = { workspace = true }
lru = { workspace = true }
rand = { workspace = true }
ulid = { workspace = true }
nanoid = { workspace = true }
base64 = { workspace = true }
once_cell = { workspace = true }
indexmap = { workspace = true }
decancer = { workspace = true }
deadqueue = { workspace = true }
linkify = { workspace = true, optional = true }
url-escape = { workspace = true, optional = true }
validator = { workspace = true, features = ["derive"] }
isahc = { workspace = true, features = ["json"], optional = true }
base32 = { workspace = true }
sha1 = { workspace = true }

# Serialisation
serde_json = { workspace = true }
revolt_optional_struct = { workspace = true }
serde = { workspace = true }
iso8601-timestamp = { workspace = true, features = ["serde", "bson"] }
erltf_serde = { workspace = true, features = ["elixir-interop"] }

# Events
redis-kiss = { workspace = true, default-features = false, features = [
    "tokio-runtime",
] }

# Database
bson = { workspace = true }
mongodb = { workspace = true }

# Database Migration
unicode-segmentation = { workspace = true }
regex = { workspace = true }

# Async Language Features
futures = { workspace = true }
async-lock = { workspace = true }
async-trait = { workspace = true }
async-recursion = { workspace = true }

# Async
tokio = { workspace = true, optional = true }

# Axum Impl
axum = { workspace = true, optional = true }
utoipa = { workspace = true, features = ["axum_extras"], optional = true }

# Rocket Impl
schemars = { workspace = true, optional = true }
rocket = { workspace = true, features = ["json"], optional = true }
revolt_okapi = { workspace = true, optional = true }
revolt_rocket_okapi = { workspace = true, optional = true }

# RabbitMQ
lapin = { workspace = true, features = ["tokio"] }

# Voice
livekit-api = { workspace = true, features = [
    "rustls-tls-native-roots",
], optional = true }
livekit-protocol = { workspace = true, optional = true }
livekit-runtime = { workspace = true, features = ["tokio"], optional = true }

# Security
totp-lite = { workspace = true }
rust-argon2 = { workspace = true }

# Email
lettre = { workspace = true }
handlebars = { workspace = true }

# Web Requests
reqwest = { workspace = true, features = ["json", "form"] }
