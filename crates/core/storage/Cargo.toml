[package]
name = "sonm-storage"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
authors = ["Paul Makles <me@insrt.uk>"]
description = "Sonm: S3 and encryption subroutines"
repository = "https://github.com/krynce/sonm-backend"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }

tracing = { workspace = true }

tokio = { workspace = true, features = ["sync", "rt-multi-thread"] }

ffprobe = { workspace = true }
imagesize = { workspace = true }
tempfile = { workspace = true }

base64 = { workspace = true }
aes-gcm = { workspace = true }
typenum = { workspace = true }

aws-config = { workspace = true }
# The default feature set includes "rustls", which is the *legacy* connector: it pulls
# hyper 0.14, h2 0.3, rustls 0.21 and rustls-webpki 0.101 into the build, each with open
# RUSTSEC advisories and no path to a fix. This is aws-sdk-s3's default set with that one
# feature dropped; "default-https-client" is the modern connector and stays.
aws-sdk-s3 = { workspace = true, default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }

sonm-config = { workspace = true, features = ["report-macros"] }
sonm-result = { workspace = true }

# image processing
jxl-oxide = { workspace = true, features = ["image"] }
image = { workspace = true, features = [
    "avif-native",
] } # AVIF decoding requires dav1d

# svg rendering
usvg = { workspace = true }
resvg = { workspace = true }
tiny-skia = { workspace = true }

# encoding
webp = { workspace = true }

[dev-dependencies]
uuid = { workspace = true, features = ["v4"] }
