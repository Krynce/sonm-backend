[package]
name = "sonm-config"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
authors = ["Paul Makles <me@insrt.uk>"]
description = "Sonm: Configuration"
repository = "https://github.com/krynce/sonm-backend"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
anyhow = ["dep:sentry-anyhow"]
report-macros = ["sonm-result"]
sentry = ["dep:sentry"]
test = ["tokio"]
default = ["sentry"]

[dependencies]
# Utility
config = { workspace = true }

# Serde
serde = { workspace = true }

# Async
futures-locks = { workspace = true }
tokio = { workspace = true, optional = true }

# Logging
log = { workspace = true }
pretty_env_logger = { workspace = true }

# Sentry
sentry = { workspace = true, optional = true }
sentry-anyhow = { workspace = true, optional = true }

# Core
sonm-result = { workspace = true, optional = true }

[dev-dependencies]
# Without these the crate's own `#[tokio::test]`s only compile as part of the workspace,
# where feature unification happens to supply them.
tokio = { workspace = true, features = ["macros", "rt"] }
