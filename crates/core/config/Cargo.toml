[package]
name = "sonm-config"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Paul Makles <me@insrt.uk>"]
description = "Sonm: Configuration"
repository = "https://github.com/krynce/sonm-backend"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
anyhow = ["dep:sentry-anyhow"]
report-macros = ["sonm-result"]
sentry = ["dep:sentry"]
test = ["tokio"]
default = ["sentry"]

[dependencies]
# Utility
config = { workspace = true }
cached = { workspace = true }

# Serde
serde = { workspace = true }

# Async
futures-locks = { workspace = true }
tokio = { workspace = true, optional = true }

# Logging
log = { workspace = true }
pretty_env_logger = { workspace = true }

# Sentry
sentry = { workspace = true, optional = true }
sentry-anyhow = { workspace = true, optional = true }

# Core
sonm-result = { workspace = true, optional = true }
