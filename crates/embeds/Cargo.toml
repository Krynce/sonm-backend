[package]
name = "sonm-embeds"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# Utility
mime = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
lazy_static = { workspace = true }
moka = { workspace = true, features = ["future"] }

# Web scraping
scraper = { workspace = true }
encoding_rs = { workspace = true }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
async-recursion = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

# Web requests
reqwest = { workspace = true, features = ["json"] }
pdk-ip-filter-lib = "1.8.0"
url = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Core crates
sonm-config = { workspace = true }
sonm-models = { workspace = true }
sonm-result = { workspace = true, features = ["utoipa", "axum"] }
sonm-storage = { workspace = true }

# Axum / web server
axum = { workspace = true }
axum-extra = { workspace = true, features = ["typed-header"] }

# OpenAPI & documentation generation
utoipa-scalar = { workspace = true, features = ["axum"] }
utoipa = { workspace = true, features = ["axum_extras", "ulid"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
