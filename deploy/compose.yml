name: sonm

# Production stack behind the shared Traefik (proxy_net, resolver myresolver).
# Data lives in ${DATA_DIR} — the old Stoat self-hosted ./data, reused in place.
# Never run this alongside the old stack: both would open the same Mongo files.

# Docker keeps container logs forever by default; database alone was 329 MB of the 333 MB total.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend: &backend
  env_file: secrets.env
  restart: always
  logging: *logging
  volumes:
    - ./Sonm.toml:/Sonm.toml:ro

x-public: &public
  networks: [default, proxy_net]

# The service images are distroless, so the probe runs through the busybox copied into them.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  database:
    # ponytail: mongo 8.x не стартует на ядре Ubuntu 7.0.0-N (SERVER-121912); вернуть latest, когда ядро будет >= 7.0.14 или 7.1
    image: docker.io/mongo:7.0
    # WiredTiger would otherwise size its cache at ~1.45 GB of this 3.9 GB host.
    # --bind_ip_all is what the image's entrypoint adds by default; spelled out because
    # overriding the command is what would otherwise drop it.
    command: mongod --bind_ip_all --wiredTigerCacheSizeGB 0.35
    restart: always
    # mem_limit is a fuse, not a reservation: the sum may exceed RAM, what matters is that
    # the cgroup kills one container before the kernel kills the host (there is no swap).
    mem_limit: 640m
    logging: *logging
    volumes:
      - ${DATA_DIR:?}/db:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: valkey/valkey:9-alpine
    command: valkey-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    restart: always
    mem_limit: 128m
    logging: *logging

  rabbit:
    image: docker.io/rabbitmq:4
    restart: always
    mem_limit: 384m
    logging: *logging
    environment:
      # Must match SONM__RABBIT__USERNAME/__PASSWORD in secrets.env.
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?}
    configs:
      - source: rabbit_conf
        target: /etc/rabbitmq/conf.d/10-sonm.conf
    volumes:
      - ${DATA_DIR:?}/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  minio:
    image: docker.io/minio/minio
    # ponytail: minio/minio is gone from Docker Hub; reuse the copy already on the VPS until the move to cloud MinIO
    pull_policy: missing
    command: server /data
    restart: always
    mem_limit: 256m
    logging: *logging
    volumes:
      - ${DATA_DIR:?}/minio:/data
    environment:
      # Credentials live in .env next to this file; :? makes compose refuse to start without them,
      # which is what keeps a missing .env from silently resetting them.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - revolt-uploads.minio # virtual-host bucket access

  scheduler:
    <<: *backend
    image: ghcr.io/krynce/sonm-backend/scheduler:${BACKEND_TAG:?}
    mem_limit: 96m
    depends_on:
      database: { condition: service_healthy }
      rabbit: { condition: service_healthy }
      minio: { condition: service_started }

  api:
    <<: [*backend, *public]
    image: ghcr.io/krynce/sonm-backend/api:${BACKEND_TAG:?}
    mem_limit: 320m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:14702/health"]
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_started }
      rabbit: { condition: service_healthy }
      scheduler: { condition: service_started } # declares the sonm.default exchange
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_net
      - traefik.http.routers.sonm-api.rule=Host(`${DOMAIN:?}`) && PathPrefix(`/api`)
      - traefik.http.routers.sonm-api.entrypoints=websecure
      - traefik.http.routers.sonm-api.tls.certresolver=myresolver
      - traefik.http.routers.sonm-api.middlewares=sonm-strip
      - traefik.http.services.sonm-api.loadbalancer.server.port=14702
      - traefik.http.services.sonm-api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.sonm-api.loadbalancer.healthcheck.interval=15s
      # Shared by every router below: drops the service prefix before proxying.
      - traefik.http.middlewares.sonm-strip.stripprefix.prefixes=/api,/ws,/files,/autumn,/embeds,/january,/livekit

  gateway:
    <<: [*backend, *public]
    image: ghcr.io/krynce/sonm-backend/gateway:${BACKEND_TAG:?}
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      # 14703 speaks WebSocket; the health endpoint has its own port.
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:14713/"]
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_started }
      rabbit: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_net
      - traefik.http.routers.sonm-gateway.rule=Host(`${DOMAIN:?}`) && PathPrefix(`/ws`)
      - traefik.http.routers.sonm-gateway.entrypoints=websecure
      - traefik.http.routers.sonm-gateway.tls.certresolver=myresolver
      - traefik.http.routers.sonm-gateway.middlewares=sonm-strip
      - traefik.http.services.sonm-gateway.loadbalancer.server.port=14703

  files:
    <<: [*backend, *public]
    image: ghcr.io/krynce/sonm-backend/files:${BACKEND_TAG:?}
    # Tight against a 192 MiB S3 cache plus image decoding; see 2.4/2.5 in the optimization plan.
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:14704/health"]
    depends_on:
      database: { condition: service_healthy }
      minio: { condition: service_started }
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_net
      # ponytail: /autumn — старые ссылки и вкладки старого клиента; убрать через пару недель
      - traefik.http.routers.sonm-files.rule=Host(`${DOMAIN:?}`) && (PathPrefix(`/files`) || PathPrefix(`/autumn`))
      - traefik.http.routers.sonm-files.entrypoints=websecure
      - traefik.http.routers.sonm-files.tls.certresolver=myresolver
      - traefik.http.routers.sonm-files.middlewares=sonm-strip
      - traefik.http.services.sonm-files.loadbalancer.server.port=14704
      - traefik.http.services.sonm-files.loadbalancer.healthcheck.path=/health
      - traefik.http.services.sonm-files.loadbalancer.healthcheck.interval=15s

  embeds:
    <<: [*backend, *public]
    image: ghcr.io/krynce/sonm-backend/embeds:${BACKEND_TAG:?}
    mem_limit: 160m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:14705/health"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_net
      # ponytail: /january — как /autumn выше
      - traefik.http.routers.sonm-embeds.rule=Host(`${DOMAIN:?}`) && (PathPrefix(`/embeds`) || PathPrefix(`/january`))
      - traefik.http.routers.sonm-embeds.entrypoints=websecure
      - traefik.http.routers.sonm-embeds.tls.certresolver=myresolver
      # embeds has no database, so it cannot use the in-process ratelimiter the other
      # services share; the edge proxy limits it per source IP instead.
      - traefik.http.middlewares.sonm-embeds-rl.ratelimit.average=20
      - traefik.http.middlewares.sonm-embeds-rl.ratelimit.burst=50
      - traefik.http.routers.sonm-embeds.middlewares=sonm-strip,sonm-embeds-rl
      - traefik.http.services.sonm-embeds.loadbalancer.server.port=14705
      - traefik.http.services.sonm-embeds.loadbalancer.healthcheck.path=/health
      - traefik.http.services.sonm-embeds.loadbalancer.healthcheck.interval=15s

  push:
    <<: *backend
    image: ghcr.io/krynce/sonm-backend/push:${BACKEND_TAG:?}
    mem_limit: 96m
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_started }
      rabbit: { condition: service_healthy }

  voice:
    <<: *backend
    image: ghcr.io/krynce/sonm-backend/voice:${BACKEND_TAG:?}
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:8500/health"]
    depends_on:
      database: { condition: service_healthy }
      rabbit: { condition: service_healthy }

  livekit:
    <<: *public
    image: ghcr.io/stoatchat/livekit-server:v1.9.14
    command: --config /etc/livekit.yml
    restart: always
    mem_limit: 256m
    logging: *logging
    depends_on: [redis]
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yml:/etc/livekit.yml:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_net
      - traefik.http.routers.sonm-livekit.rule=Host(`${DOMAIN:?}`) && PathPrefix(`/livekit`)
      - traefik.http.routers.sonm-livekit.entrypoints=websecure
      - traefik.http.routers.sonm-livekit.tls.certresolver=myresolver
      - traefik.http.routers.sonm-livekit.middlewares=sonm-strip
      - traefik.http.services.sonm-livekit.loadbalancer.server.port=7880

  web:
    <<: *public
    image: ghcr.io/krynce/sonm-web:${WEB_TAG:?}
    restart: always
    # Node грузит бандл в память на этапе inject.js: 64m убивало контейнер (OOM 137)
    mem_limit: 256m
    logging: *logging
    environment:
      VITE_API_URL: https://${DOMAIN:?}/api
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_net
      - traefik.http.routers.sonm-web.rule=Host(`${DOMAIN:?}`)
      - traefik.http.routers.sonm-web.entrypoints=websecure
      - traefik.http.routers.sonm-web.tls.certresolver=myresolver
      - traefik.http.services.sonm-web.loadbalancer.server.port=5000

  # /desktop downloads the portable Windows exe built from sonm-desktop (cargo build --release).
  desktop:
    image: nginx:alpine
    restart: always
    mem_limit: 32m
    logging: *logging
    networks: [proxy_net]
    volumes:
      - ./Sonm.exe:/srv/Sonm.exe:ro
    configs:
      - source: desktop_nginx
        target: /etc/nginx/conf.d/default.conf
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy_net
      - traefik.http.routers.sonm-desktop.rule=Host(`${DOMAIN:?}`) && Path(`/desktop`)
      - traefik.http.routers.sonm-desktop.entrypoints=websecure
      - traefik.http.routers.sonm-desktop.tls.certresolver=myresolver
      - traefik.http.routers.sonm-desktop.priority=100
      - traefik.http.services.sonm-desktop.loadbalancer.server.port=80

configs:
  rabbit_conf:
    content: |
      # Default is 60% of host RAM, which on this host is more than the whole stack has.
      vm_memory_high_watermark.absolute = 256MiB

  desktop_nginx:
    content: |
      server {
        listen 80;
        location = /desktop {
          alias /srv/Sonm.exe;
          default_type application/vnd.microsoft.portable-executable;
          add_header Content-Disposition 'attachment; filename="Sonm.exe"';
          add_header Cache-Control no-cache;
        }
      }

networks:
  proxy_net:
    external: true
