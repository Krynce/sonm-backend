name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dav1d
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdav1d-dev pkg-config

          if ! pkg-config --atleast-version=1.3.0 dav1d; then
            echo "The runner's dav1d is older than 1.3, will install build tools"
            sudo apt-get install --yes meson ninja-build nasm
          fi

      - uses: jdx/mise-action@v2

      # Without this every run rebuilds the whole dependency tree from scratch.
      - uses: Swatinem/rust-cache@v2

      # Cheapest check first, so a formatting slip doesn't wait on a full build.
      - run: cargo fmt --all --check
      - run: mise check
      - run: mise build
      - run: mise docker:start
      - run: mise test

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reads deny.toml; needs neither a toolchain nor dav1d, so it runs beside the build.
      - uses: EmbarkStudios/cargo-deny-action@v2
