name: Docker

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/krynce/sonm-backend

jobs:
  base:
    name: Build base image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64 # VPS is x86_64; add linux/arm64 if ever needed (doubles build time)
          tags: ${{ env.REGISTRY }}/base:latest
          # 4 = runner cores; the default 10 ran 7 LTO links at once and ran out of memory
          build-args: CARGO_BUILD_JOBS=4
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: base
    strategy:
      matrix:
        service: [api, gateway, files, embeds, scheduler, push, voice]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64 # VPS is x86_64; add linux/arm64 if ever needed (doubles build time)
          file: crates/${{ matrix.service }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
